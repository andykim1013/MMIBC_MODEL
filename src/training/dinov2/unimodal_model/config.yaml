# training/unimodal/config.yaml
#
# Configuration for unimodal training runs.
# Paths are relative to where the script is run (e.g., from the 'unimodal' directory)
# or absolute paths.

# -- Run Details --
run_name: "Unimodal_DINOv2s_Finetune"

ultrasound_path: "C:/Users/konyang/Desktop/MMIBC-main/mmibc/ultrasound/images"
mammo_data_path: "C:/Users/konyang/Desktop/MMIBC-main/mmibc/mammo"
mammo_csv_path: "C:/Users/konyang/Desktop/MMIBC-main/mmibc/mammo/vindr_mammo_metadata.csv"

model:
  name: "dinov2_vitl14"
  n_classes: 2
  freeze_backbone: true

training:
  image_size: 224
  batch_size: 32
  epochs: 50
  learning_rate: 0.001
  weight_decay: 0.05
  dropout_rate: 0.3
  num_workers: 0
  output_dir: "outputs/mammo_experiment_1"
  patience: 15
  min_delta: 0.0005
  focal_loss:
    gamma: 2.0
    alpha: 0.25
  early_stopping:
    monitor: "val_loss"
    mode: "min"
    patience: 25
    min_delta: 0.0001
  progressive_finetuning:
    enabled: true
    epochs_stage1: 30
    lr_stage1: 0.001
    unfreeze_layers_stage2: 2
    lr_backbone_stage2: 0.000005
    lr_head_stage2: 0.0001

output:
  model_save_path: "C:/Users/konyang/Desktop/MMIBC-main/saved_models"
  tensorboard_log_dir: "C:/Users/konyang/Desktop/MMIBC-main/runs"
  tuning_results_csv: "hyperparameter_tuning_results.csv"